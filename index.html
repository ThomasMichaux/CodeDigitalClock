<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="color-scheme" content="light dark">
    <meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
    <meta name="description"
        content="A high-contrast dark mode digital clock with date, location, and weather information.">
    <link rel="stylesheet" href="style.css">
    <title>Digital Clock & Weather</title>
</head>

<body>
    <a href="#main-content" class="skip-link">Skip to main content</a>

    <header class="visually-hidden">
        <h1>Digital Clock & Weather</h1>
    </header>

    <main id="main-content" class="app-container" tabindex="-1">
        <section class="time-section" aria-labelledby="time-heading">
            <h2 id="time-heading" class="visually-hidden">Current Time</h2>
            <div data-clock class="clock-display" role="timer" aria-atomic="true">00:00<span class="seconds-indicator"
                    aria-hidden="true">:00</span></div>
        </section>

        <section class="date-section" aria-labelledby="date-heading">
            <h2 id="date-heading" class="visually-hidden">Current Date</h2>
            <div data-date class="date-display" role="status" aria-atomic="true">
                <span class="date-main skeleton" aria-busy="true">Loading Date</span>
                <span class="date-secondary skeleton" aria-busy="true">Loading Context</span>
            </div>
        </section>

        <section class="info-grid" aria-labelledby="info-heading">
            <h2 id="info-heading" class="visually-hidden">Location and Weather Information</h2>

            <article class="card">
                <div class="icon-box" data-loc-icon-box>
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                        stroke-linejoin="round" aria-hidden="true">
                        <path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"></path>
                        <circle cx="12" cy="10" r="3"></circle>
                    </svg>
                </div>
                <div class="card-content">
                    <span class="label">Location</span>
                    <span data-location class="value skeleton" aria-busy="true">Locating...</span>
                </div>
            </article>

            <article class="card">
                <div class="icon-box">
                    <div data-weather-icon-container>
                        <svg data-default-weather-icon viewBox="0 0 24 24" fill="none" stroke="currentColor"
                            stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                            <path d="M12 2v2"></path>
                            <path d="M12 20v2"></path>
                            <path d="m4.93 4.93 1.41 1.41"></path>
                            <path d="m17.66 17.66 1.41 1.41"></path>
                            <path d="M2 12h2"></path>
                            <path d="M20 12h2"></path>
                            <path d="m6.34 17.66-1.41 1.41"></path>
                            <path d="m19.07 4.93-1.41 1.41"></path>
                            <circle cx="12" cy="12" r="4"></circle>
                        </svg>
                    </div>
                </div>
                <div class="card-content">
                    <span class="label">Weather</span>
                    <div class="value">
                        <span data-temp>--</span>°<span data-weather-desc class="temp-high">Loading...</span>
                    </div>
                </div>
            </article>

        </section>

        <div data-error-container class="error-msg" role="alert" aria-live="assertive" hidden></div>
    </main>

    <footer class="app-footer">
        <p>High-Contrast Dark Mode</p>
    </footer>

    <script src="script.js" defer></script>
</body>

</html>
